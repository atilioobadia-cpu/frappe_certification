<div>
    <p>
        <strong>{{ frappe.db.get_value("Airplane", doc.airplane, "airline") }}</strong> |
        {{ doc.source_airport_code }} → {{ doc.destination_airport_code }} |
        {{ frappe.utils.format_date(doc.date_of_departure, "d MMMM, YYYY") }} |
        {{ doc.time_of_departure }} |
        {{ frappe.utils.format_duration(doc.duration) }}
    </p>
    <a href="/{{ doc.route |e }}">View Flight</a>
</div>
